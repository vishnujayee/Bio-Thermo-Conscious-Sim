[project]
name = "btcs"
version = "0.1.0"
description = "Bio-Thermo-Conscious-Sim: LLM organisms under non-equilibrium thermodynamics"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "anthropic>=1.0",
    "mcp>=2.0",
    "langgraph>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
